name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The desktop entrypoints embed the built frontend assets
      # (go:embed assets/dist), so every Go compile step needs them first.
      - name: Build embedded frontends
        run: |
          npm run build --workspace frontend
          npm run build --workspace master-frontend

      - name: Check gofmt
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          unformatted="$(gofmt -l go)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet Go packages
        working-directory: go
        run: go vet ./...

      - name: Test Go packages
        working-directory: go
        run: go test -race -count=1 ./...

      # Compile the real Wails desktop entrypoints with production tags so the
      # cgo/ObjC paths (e.g. nativedialog) are covered before a release build.
      - name: Build desktop apps with production tags (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: go
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -framework UniformTypeIdentifiers -mmacosx-version-min=13.0
        run: go build -tags desktop,production ./cmd/...

  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, master-frontend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        if: matrix.app == 'frontend'
        run: npm audit --audit-level=high

      - name: Test shared frontend
        if: matrix.app == 'frontend'
        run: npm test --workspace shared-frontend

      - name: Type-check and build
        working-directory: ${{ matrix.app }}
        run: npm run build

  release-scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release automation
        run: node --test scripts/*.test.mjs
